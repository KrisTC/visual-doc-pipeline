[project]
name = "visual-doc-pipeline"
version = "0.1.0"
description = "Configurable pipeline for visible-text replacement in documents and images."
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "openpyxl",
    "pypdf",
    "python-docx",
    "python-pptx",
]

[tool.uv]
exclude-newer = "7 days"
no-build = true
no-sources = true
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
