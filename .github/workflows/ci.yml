name: Continuous integration

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request merge result
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.13.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.13.14
      - name: Validate dependency policy
        run: python scripts/check-dependency-policy.py

  python-verification:
    name: Python verification
    needs: dependency-policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request merge result
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.13.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.13.14
      - name: Install uv
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: uv==0.11.23"
      - name: Synchronize the locked CPU development environment
        run: python scripts/sync_verified_dependencies.py --extra cpu
      - name: Type-check Python
        env:
          VISUAL_DOC_PIPELINE_UV_EXTRA: cpu
        run: ./run.sh scripts/typecheck-python.py
      - name: Run automated tests
        env:
          VISUAL_DOC_PIPELINE_UV_EXTRA: cpu
        run: scripts/run-tests.sh

  oci-build:
    name: OCI build
    needs: dependency-policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request merge result
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the CPU image
        run: docker build --platform linux/amd64 --target cpu --tag visual-doc-pipeline:ci-cpu .
      - name: Build the GPU image
        run: docker build --platform linux/amd64 --target gpu --tag visual-doc-pipeline:ci-gpu .
