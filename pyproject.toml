[project]
name = "visual-doc-pipeline"
version = "0.1.0"
description = "Configurable pipeline for visible-text replacement in documents and images."
readme = "README.md"
requires-python = "==3.13.14"
dependencies = [
    "argostranslate>=1.11.0",
    "google-cloud-translate>=3.27.0",
    "numpy",
    "openpyxl",
    "paddleocr==3.7.0",
    "pillow",
    "pypdf",
    "pypdfium2==5.13.0",
    "python-docx",
    "python-pptx",
    "regex",
    "rich>=15.0.0",
    "skia-python>=144.0.post2",
    "torch==2.13.0+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
cpu = [
    "paddlepaddle==3.3.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
gpu = [
    "paddlepaddle==3.3.1; sys_platform != 'win32' and (sys_platform != 'linux' or platform_machine != 'x86_64')",
    "paddlepaddle-gpu==3.3.1; sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]

[dependency-groups]
dev = [
    "mypy",
    "types-openpyxl",
]

[tool.uv]
exclude-newer = "7 days"
no-build = true
package = false
conflicts = [
    [{ extra = "cpu" }, { extra = "gpu" }],
]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true
exclude-newer = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu/"
explicit = true
exclude-newer = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.mypy]
files = ["pipeline", "scripts", "tests"]
python_version = "3.13"
strict = true
disallow_any_explicit = true
warn_unreachable = true
