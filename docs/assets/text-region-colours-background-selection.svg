<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title description">
  <title id="title">How the immediate background is selected</title>
  <desc id="description">A crop has an outer ring and an OCR polygon. Within the polygon, cyan is the largest local colour cluster and becomes the background. A green map patch is retained as secondary background evidence, while black glyph pixels are considered later as text candidates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .label { font: 600 16px system-ui, sans-serif; fill: #172033; }
      .body { font: 14px system-ui, sans-serif; fill: #374151; }
      .small { font: 12px system-ui, sans-serif; fill: #4b5563; }
      .callout { fill: none; stroke: #374151; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="510" fill="#ffffff"/>
  <text x="32" y="36" class="label">One OCR region: choose the surface behind the glyphs</text>
  <text x="32" y="60" class="body">The largest coherent colour cluster inside the polygon is the immediate background.</text>

  <rect x="32" y="94" width="448" height="312" rx="12" fill="#f3f4f6" stroke="#94a3b8" stroke-width="2"/>
  <text x="48" y="120" class="small">12px local crop</text>

  <rect x="62" y="142" width="388" height="234" rx="5" fill="#e6edf0"/>
  <path d="M62 142 H450 V376 H62 Z M94 172 H418 V346 H94 Z" fill="#d9e0e6" fill-rule="evenodd"/>
  <rect x="94" y="172" width="324" height="174" rx="4" fill="#85cee0"/>

  <path d="M294 180 C350 194 365 217 418 217 V318 C367 316 349 337 291 338 Z" fill="#c9f3dc"/>
  <path d="M101 271 C151 245 187 261 222 245" fill="none" stroke="#8aa9bd" stroke-width="5" opacity="0.8"/>
  <path d="M102 276 C154 251 187 266 222 250" fill="none" stroke="#f9fafb" stroke-width="2" opacity="0.9"/>

  <text x="142" y="286" font-family="system-ui, sans-serif" font-size="47" font-weight="700" fill="#2b2c30">TEXT</text>
  <rect x="94" y="172" width="324" height="174" rx="4" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="100" y="365" class="small" fill="#b91c1c">OCR polygon: foreground analysis stays inside</text>

  <rect x="524" y="102" width="396" height="71" rx="9" fill="#e5f7fb" stroke="#58b6d1"/>
  <rect x="542" y="121" width="28" height="28" rx="4" fill="#85cee0"/>
  <text x="583" y="126" class="label">Dominant cluster → background</text>
  <text x="583" y="148" class="body">Most polygon pixels are cyan, so return #85CEE0.</text>
  <path d="M524 142 C483 142 462 194 378 221" class="callout"/>

  <rect x="524" y="196" width="396" height="83" rx="9" fill="#effcf3" stroke="#86c99e"/>
  <rect x="542" y="214" width="28" height="28" rx="4" fill="#c9f3dc"/>
  <text x="583" y="220" class="label">Secondary background evidence</text>
  <text x="583" y="242" class="body">The green patch is broad enough to remember,</text>
  <text x="583" y="261" class="body">so it is not mistaken for text later.</text>
  <path d="M524 242 C480 242 446 254 362 254" class="callout"/>

  <rect x="524" y="302" width="396" height="71" rx="9" fill="#f4f5f6" stroke="#9ca3af"/>
  <rect x="542" y="321" width="28" height="28" rx="4" fill="#2b2c30"/>
  <text x="583" y="326" class="label">Dark glyphs are not background</text>
  <text x="583" y="348" class="body">They are scored later as foreground candidates.</text>
  <path d="M524 339 C474 339 426 315 271 285" class="callout"/>

  <path d="M145 132 C145 92 80 86 75 143" class="callout"/>
  <text x="72" y="85" class="small">Outer ring: fallback only</text>

  <text x="32" y="452" class="body">Important: “background” means the local surface immediately behind the glyphs,</text>
  <text x="32" y="474" class="body">not necessarily the most common colour in the wider image crop.</text>
</svg>

