[project]
name = "visual-doc-pipeline"
version = "0.1.0"
description = "Configurable pipeline for visible-text replacement in documents and images."
readme = "README.md"
requires-python = "==3.13.14"
dependencies = [
    "argostranslate>=1.11.0",
    "numpy",
    "openpyxl",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "pillow",
    "pypdf",
    "python-docx",
    "python-pptx",
    "skia-python>=144.0.post2",
    "tqdm",
]

[dependency-groups]
dev = [
    "mypy",
    "types-openpyxl",
    "types-tqdm",
]

[tool.uv]
exclude-newer = "7 days"
no-build = true
no-sources = true
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.mypy]
files = ["pipeline", "scripts", "tests"]
python_version = "3.13"
strict = true
disallow_any_explicit = true
warn_unreachable = true
